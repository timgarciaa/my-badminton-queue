AWSTemplateFormatVersion: '2010-09-09'
Description: MBQ API - phone check-in and club data with organizer sign-in (Lambda function URL, DynamoDB, Cognito). Deploy with server/deploy.sh.

Parameters:
  AllowOrigin:
    Type: String
    Default: https://timgarciaa.github.io
    Description: Where the app is served from (CORS).

Resources:
  # One item per open check-in; removed by TTL a day after the iPad last updated it.
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: code, AttributeType: S }
      KeySchema:
        - { AttributeName: code, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  # Clubs, their documents, organizers and join codes (see server/lambda.mjs).
  ClubTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      # Restore to any point in the last 35 days (a fraction of a cent a month at this size).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Organizer accounts: username and password only, no email. Made by the API's
  # sign-up (or server/club.sh); which club they organize is in the club table.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: mbq-organizers
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: admin_only, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      Schema:
        - { Name: club, AttributeDataType: String, Mutable: true }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: mbq-app
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      # Stay signed in on the club iPad for a year; tokens for requests last an hour.
      RefreshTokenValidity: 365
      IdTokenValidity: 1
      AccessTokenValidity: 1
      TokenValidityUnits: { RefreshToken: days, IdToken: hours, AccessToken: hours }
      ReadAttributes: [custom:club]
      # Organizers can't change their own club.
      WriteAttributes: [name]

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: checkin-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt ClubTable.Arn
              # Sign-up makes accounts; declining a request deletes one.
              - Effect: Allow
                Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminSetUserPassword, cognito-idp:AdminDeleteUser]
                Resource: !GetAtt UserPool.Arn

  Function:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: lambda.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt Role.Arn
      Environment:
        Variables:
          TABLE: !Ref Table
          CLUB_TABLE: !Ref ClubTable
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient
      # Placeholder: deploy.sh uploads the real code (server/*.mjs).
      Code:
        ZipFile: 'exports.handler = async () => ({ statusCode: 503 })'

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Function}
      RetentionInDays: 14

  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      AuthType: NONE
      Cors:
        AllowOrigins: [!Ref AllowOrigin]
        AllowMethods: [GET, POST, PUT, DELETE]
        AllowHeaders: [content-type, x-key, x-pin, authorization]
        MaxAge: 3600

  # A public function URL needs both permissions.
  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  Url:
    Value: !GetAtt Url.FunctionUrl
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref UserPoolClient
  ClubTable:
    Value: !Ref ClubTable
